<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link
			rel="icon"
			type="image/png"
			sizes="32x32"
			href="./images/favicon-32x32.png"
		/>
		<title>Frontend Mentor | QR code component</title>
		<link rel="stylesheet" href=./styles/main.css" />
	</head>
	<body>
		<main class="main-container">
			<div class="qr-code-card card">
				<div class="card-content">
					<!-- Note: For me it makes more sense to show the content first, then the image of the QR Code -->
					<h1 class="card-title">
						Improve your front-end skills by building projects
					</h1>
					<p class="card-text">
						Scan the QR code to visit Frontend Mentor and take your coding
						skills to the next level
					</p>
				</div>
				<div class="card-qr-code">
					<a
						href="https://www.frontendmentor.io/"
						target="_blank"
						class="qr-code-image-link"
					>
						<img
							src="./images/image-qr-code.png"
							alt="QR code for Frontend Mentor"
							class="qr-code-image"
						/>
					</a>
				</div>
			</div>
		</main>
		<footer class="footer-attribution">
			Challenge by
			<a href="https://www.frontendmentor.io?ref=challenge" target="_blank"
				>Frontend Mentor</a
			>. Coded by <a href="https://nottin.me" target="_blank">Sirius Nottin</a>.
		</footer>
	</body>
</html>
